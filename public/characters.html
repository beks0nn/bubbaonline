<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico?v=1" sizes="16x16 32x32">
    <link rel="icon" href="/favicon.svg?v=1" type="image/svg+xml" sizes="any">
    <title>Characters - BubbaOnline"></title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }

        header {
            border-bottom: 1px solid #2a2a2a;
            background: #181818;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
        }

        nav a:hover,
        nav a.active {
            color: #fff;
            background: #292929;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        h1 {
            margin: 0 0 20px;
            font-size: 28px;
        }

        .search {
            width: 100%;
            padding: 11px 14px;
            margin-bottom: 20px;
            border: 1px solid #333;
            border-radius: 6px;
            background: #181818;
            color: #eee;
            font-size: 15px;
            outline: none;
        }

        .search:focus {
            border-color: #555;
        }

        .table {
            width: 100%;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow-x: auto;
            background: #181818;
        }

        .row {
            display: grid;
            grid-template-columns: minmax(150px, 1fr) 70px 130px 180px;
            min-width: 600px;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid #242424;
        }

        .row:last-child {
            border-bottom: none;
        }

        .row.header {
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            background: #151515;
        }

        .level {
            text-align: right;
            color: #aaa;
        }

        .vocation {
            text-align: right;
            color: #aaa;
        }

        .last-online {
            text-align: right;
            color: #aaa;
        }

        .data-list .row:nth-child(even) {
            background: #1c1c1c;
        }

        .character {
            color: #fff;
        }

        a.character {
            text-decoration: none;
        }
        
        a.character:hover {
            text-decoration: underline;
        }

        #character-count {
            color: #888;
            font-weight: 400;
            font-size: 18px;
        }
            .site-brand { display: grid; gap: 5px; flex-shrink: 0; }
        .support-link { display: inline-flex; align-items: center; gap: 6px; width: fit-content; color: #bfa878; font-size: 12px; font-weight: 400; line-height: 1.4; text-decoration: none; }
        .support-link svg { width: 15px; height: 15px; flex-shrink: 0; }
        .support-link:hover { color: #eed29b; text-decoration: underline; }
        .support-link:focus-visible { outline: 2px solid #eed29b; outline-offset: 4px; border-radius: 2px; }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <div class="site-brand">
                <div class="logo">BubbaOnline</div>
                <a class="support-link" href="https://buymeacoffee.com/bksonn" target="_blank" rel="noopener noreferrer" title="Support BubbaOnline (opens in a new tab)"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h10v5a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4V7Z M14 8h1a2.5 2.5 0 0 1 0 5h-1 M3 18h13 M7 2v2 M11 2v2"/></svg><span>Buy me a coffee</span></a>
            </div>

            <nav>
                <a href="/">Online</a>
                <a href="/characters" class="active">Characters</a>
                <a href="/kills">Kills</a>
                <a href="/power-gamers">Power Gamers</a>
                <a href="/highscores">Highscores</a>
                <a href="/vocations">Vocations</a>
                <a href="/cast">Casts</a>
            </nav>
        </div>
    </header>

    <main>
        <h1>Characters <span id="character-count"></span></h1>

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search characters..."
            autocomplete="off"
        >

        <div class="table">
            <div class="row header">
                <div>Character</div>
                <div class="level">Level</div>
                <div class="vocation">Vocation</div>
                <div class="last-online">Last online</div>
            </div>

            <div id="character-list" class="data-list"></div>
        </div>
    </main>

    <script src="/presence.js"></script>
    <script src="/characters.js"></script>
</body>
</html>
