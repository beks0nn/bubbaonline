<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character - BubbaOnline</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #eee;
        }

        header {
            border-bottom: 1px solid #2a2a2a;
            background: #181818;
        }

        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        nav {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        nav a {
            color: #aaa;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 6px;
        }

        nav a:hover,
        nav a.active {
            color: #fff;
            background: #292929;
        }

        main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        h1 {
            margin: 0 0 4px;
            font-size: 28px;
        }

        .meta {
            color: #999;
            margin-bottom: 24px;
        }

        .table {
            width: 100%;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow-x: auto;
            background: #181818;
        }

        .row {
            display: grid;
            grid-template-columns: 180px 60px minmax(140px, 1fr) 240px;
            min-width: 720px;
            padding: 12px 16px;
            border-bottom: 1px solid #242424;
            gap: 12px;
        }

        .row:last-child {
            border-bottom: none;
        }

        .row.header {
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
            background: #151515;
        }

        .killer {
            color: #aaa;
        }

        .loss { color: #dbaaaa; font-variant-numeric: tabular-nums; }

        .data-list .row:nth-child(even) {
            background: #1c1c1c;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-inner">
            <div class="logo">BubbaOnline</div>

            <nav>
                <a href="/">Online</a>
                <a href="/characters">Characters</a>
                <a href="/top-frags">Top Frags</a>
                <a href="/power-gamers">Power Gamers</a>
                <a href="/highscores">Highscores</a>
                <a href="/cast">Casts</a>
            </nav>
        </div>
    </header>

    <main>
        <h1 id="char-name">Loading...</h1>
        <div class="meta" id="char-meta"></div>
        <div class="meta" id="char-last-online"></div>
        <div class="meta" id="char-profile" hidden></div>
        <div class="meta" id="char-skills" hidden></div>

        <h1>Death List</h1>
        <div class="table">
            <div class="row header">
                <div>Date</div>
                <div>Level</div>
                <div>Killed by</div>
                <div>Est. EXP lost</div>
            </div>

            <div id="death-list" class="data-list"></div>
        </div>
    </main>

    <script src="/presence.js"></script>
    <script src="/character.js"></script>
</body>
</html>
