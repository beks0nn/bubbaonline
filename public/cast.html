<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casts — BubbaOnline</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; color: #eee; background: #111; font: 15px Arial, sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    header { height: 64px; flex: 0 0 64px; padding: 0 20px; border-bottom: 1px solid #333; display: flex; gap: 18px; align-items: center; }
    header strong { font-size: 21px; } a { color: #bbb; text-decoration: none; } a:hover { color: white; }
    button { padding: 10px 16px; font: inherit; color: #eee; background: #292929; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #reload { margin-left: auto; }
    main { position: relative; flex: 1; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading-panel { position: absolute; inset: 0; display: grid; place-items: center; background: #111; padding: 20px; }
    .loading-card { width: min(440px, 100%); min-height: 300px; text-align: center; display: grid; grid-template-rows: 44px 52px 60px 20px 60px auto; align-items: center; justify-items: center; }
    h1 { margin: 0; font-size: 22px; } p { margin: 0; color: #aaa; line-height: 1.5; }
    #status { font-size: 18px; color: #eee; }
    progress { width: 100%; height: 8px; accent-color: #86b6ff; }
    .actions { min-height: 44px; display: flex; align-items: center; }
    #error { color: #f28b82; white-space: pre-wrap; overflow-wrap: anywhere; }
    @media (max-width: 480px) { header { padding: 0 12px; gap: 12px; } header strong { font-size: 17px; } #reload { font-size: 13px; padding: 8px; } }
  </style>
</head>
<body data-config-url="/api/cast/config" data-asset-base="/cast-client">
  <header><a href="/"><strong>BubbaOnline</strong></a><span>Casts</span><button id="reload" title="Restart the viewer and load the cast list again">Reload viewer</button></header>
  <main>
    <canvas id="canvas" width="1100" height="700" tabindex="0" aria-label="Live cast viewer" oncontextmenu="event.preventDefault()"></canvas>
    <section id="loading-panel" aria-label="Viewer loading">
      <div class="loading-card">
        <h1>Watch a cast</h1>
        <p id="status" role="status" aria-live="polite">Preparing viewer…</p>
        <p id="instructions">Saved viewer files are reused on your next visit.</p>
        <progress id="progress" aria-label="Loading viewer"></progress>
        <div class="actions"><button id="start" hidden>Load viewer</button><button id="retry" hidden>Try again</button></div>
        <p id="error" role="alert" hidden></p>
      </div>
    </section>
  </main>
  <noscript><p>Enable JavaScript to watch casts.</p></noscript>
  <script src="/cast.js"></script>
</body>
</html>
