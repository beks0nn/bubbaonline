<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Casts — BubbaOnline</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; color: #eee; background: #111; font: 15px Arial, sans-serif; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
    header { flex: 0 0 auto; border-bottom: 1px solid #2a2a2a; background: #181818; }
    .header-inner { max-width: 1100px; margin: 0 auto; padding: 18px 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
    .logo { font-size: 22px; font-weight: 700; color: #eee; text-decoration: none; }
    .brand-actions { display: flex; align-items: center; gap: 12px; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; font-size: 16px; }
    nav a { color: #aaa; text-decoration: none; padding: 8px 12px; border-radius: 6px; }
    nav a:hover, nav a.active { color: #fff; background: #292929; }
    :focus-visible { outline: 2px solid #9bd7a6; outline-offset: 3px; }
    button { padding: 10px 16px; font: inherit; color: #eee; background: #292929; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    #reload { white-space: nowrap; }
    main { position: relative; flex: 1; min-height: 0; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #loading-panel { position: absolute; inset: 0; display: grid; place-items: center; background: #111; padding: 20px; }
    .loading-card { width: min(440px, 100%); min-height: 300px; text-align: center; display: grid; grid-template-rows: 44px 52px 60px 20px 60px auto; align-items: center; justify-items: center; }
    h1 { margin: 0; font-size: 22px; } p { margin: 0; color: #aaa; line-height: 1.5; }
    #status { font-size: 18px; color: #eee; }
    progress { width: 100%; height: 8px; accent-color: #86b6ff; }
    .actions { min-height: 44px; display: flex; align-items: center; }
    #error { color: #f28b82; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="brand-actions">
        <a class="logo" href="/">BubbaOnline</a>
        <button id="reload" title="Restart the viewer and load the cast list again">Reload viewer</button>
      </div>
      <nav aria-label="Main navigation">
        <a href="/">Online</a>
        <a href="/characters">Characters</a>
        <a href="/top-frags">Top Frags</a>
        <a href="/power-gamers">Power Gamers</a>
        <a href="/highscores">Highscores</a>
        <a href="/cast" class="active" aria-current="page">Casts</a>
      </nav>
    </div>
  </header>
  <main>
    <canvas id="canvas" width="1100" height="700" tabindex="0" aria-label="Live cast viewer" oncontextmenu="event.preventDefault()"></canvas>
    <section id="loading-panel" aria-label="Viewer loading">
      <div class="loading-card">
        <h1>Watch a cast</h1>
        <p id="status" role="status" aria-live="polite">Preparing viewer…</p>
        <p id="instructions">Saved viewer files are reused on your next visit.</p>
        <progress id="progress" aria-label="Loading viewer"></progress>
        <div class="actions"><button id="start" hidden>Load viewer</button><button id="retry" hidden>Try again</button></div>
        <p id="error" role="alert" hidden></p>
      </div>
    </section>
  </main>
  <noscript><p>Enable JavaScript to watch casts.</p></noscript>
  <script src="/viewer.js"></script>
</body>
</html>
